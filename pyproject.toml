[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "d1-list-extraction"
version = "0.1.0"
description = "One-pass list extraction for frozen LiquidAI d1-2B with cached span decoding"
requires-python = ">=3.12"
license = "LicenseRef-LFM-Open-License-1.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy>=2.2,<2.6"]

[project.optional-dependencies]
inference = [
  "torch==2.14.1", "torchvision==0.29.1", "transformers==5.21.0",
  "onnxruntime==1.31.1", "onnx==1.23.2", "onnx-ir==1.1.0",
  "onnxscript==0.7.2", "pillow==13.0.0", "huggingface-hub==2.3.0",
]

[project.scripts]
d1-list = "d1_list_extraction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
d1_list_extraction = ["model.lock.json"]

